# Contrôles — la suite du projet, une fois par envoi sur une PR prête, et chaque lundi.
# Source : sophos (construire, « Chaque contrôle une fois »). Identique dans tous les dépôts :
# ce qui est propre au projet vit dans son lanceur, nommé dans projet.yml (politique.controle),
# et dans le bloc « projet » ci-dessous.
#
# - Pas sur un brouillon : la preuve se fait quand la PR est prête.
# - Pas après la fusion : la PR vient d'être prouvée.
# - Le lundi : la suite complète, pour ce qui ne dépend pas d'un changement.
# - Le runner se choisit sans toucher ce fichier : la variable RUNNER du dépôt, en JSON. Sans elle,
#   le runner hébergé de GitHub. Avec un forfait épuisé : ["self-hosted", "macOS"] (`outils/runner.sh` de Sophos).

name: Contrôles

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "17 5 * * 1"

# « packages: read » : lire les paquets privés de l'organisation (GitHub Packages) pendant l'installation.
# Lecture seule ; sans effet pour un projet qui n'en installe aucun.
permissions:
  contents: read
  packages: read

concurrency:
  group: controles-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  controles:
    name: Contrôles du projet
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ fromJSON(vars.RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      # projet:debut — l'installation propre au projet (langage, dépendances, clone de Sophos)
      - name: Cloner Sophos
        run: |
          git init "$RUNNER_TEMP/sophos"
          git -C "$RUNNER_TEMP/sophos" remote add origin https://github.com/antoineberjoan/sophos.git
          git -C "$RUNNER_TEMP/sophos" fetch --depth 1 origin 560b0d8359217339b6c9f5a643c2185b6afdb3ea
          git -C "$RUNNER_TEMP/sophos" checkout --detach FETCH_HEAD
          echo "SOPHOS_ROOT=$RUNNER_TEMP/sophos" >> "$GITHUB_ENV"
      # projet:fin
      # Le lanceur lit la branche de base dans BASE, pour ne lancer que ce que les fichiers touchés demandent.
      - name: Lancer le lanceur du projet
        env:
          BASE: ${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          lanceur="$(sed -n 's/^  controle:[[:space:]]*//p' projet.yml)"
          [ -n "$lanceur" ] || { echo "projet.yml n'a pas de politique.controle."; exit 1; }
          sh -c "$lanceur"
